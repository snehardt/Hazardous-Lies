name = "hazardous-lies-relay"
main = "worker.mjs"
compatibility_date = "2026-10-13"
workers_dev = true

[assets]
directory = "../_site"
binding = "ASSETS"
run_worker_first = ["/health", "/rooms/*", "/network-config.js"]

[vars]
ALLOWED_ORIGINS = "https://snehardt.github.io,http://localhost:5173,http://127.0.0.1:5173"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
