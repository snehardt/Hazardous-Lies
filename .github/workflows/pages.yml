name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out game
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build game
        run: pnpm build
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html style.css _site/
          cp -R assets dist _site/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload game
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v5
